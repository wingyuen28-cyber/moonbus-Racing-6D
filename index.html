<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoonBus V9.8.5 真落飛完整版 (連贏大單監測)</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0a0a0a;
    color: #fff;
    margin: 0;
    padding: 12px;
  }
  
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #222;
    padding-bottom: 10px;
    margin-bottom: 10px;
  }
  
  .title {
    font-size: 17px;
    font-weight: bold;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .live-dot {
    width: 8px;
    height: 8px;
    background: #00ff88;
    border-radius: 50%;
    display: inline-block;
    animation: blink 1s infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .reset-btn {
    background: #222;
    color: #00ff88;
    border: 1px solid #00ff88;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
  }
  .reset-btn:active { background: #00ff88; color: #000; }

  #status {
    font-size: 11px;
    color: #888;
    margin-bottom: 8px;
    display: block;
  }

  /* 場次選擇器 */
  .race-selector {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 8px;
    -webkit-overflow-scrolling: touch;
  }

  .race-btn {
    background: #1e1e1e;
    color: #ccc;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    flex-shrink: 0;
  }

  .race-btn.active {
    background: #00ff88;
    color: #000;
    border-color: #00ff88;
  }

  /* 大單/異動監測區塊 */
  .alert-section {
    background: #141f18;
    border: 1px solid #00ff8833;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 12px;
  }
  .alert-title {
    font-size: 12px;
    color: #00ff88;
    font-weight: bold;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
  }
  .combo-grid {
    display: grid;
    grid-template-columns: repeat( auto-fit, minmax(100px, 1fr) );
    gap: 6px;
  }
  .combo-card {
    background: #0a0a0a;
    border: 1px solid #222;
    border-radius: 6px;
    padding: 6px 8px;
    text-align: center;
  }
  .combo-name { font-size: 13px; font-weight: bold; color: #fff; }
  .combo-odds { font-size: 14px; font-weight: bold; color: #00ff88; }
  .combo-drop { font-size: 10px; color: #00ff88; }

  /* 賠率卡片 (WIN & PLA) */
  .section-title {
    font-size: 13px;
    color: #aaa;
    margin: 8px 0 4px 2px;
    font-weight: bold;
  }
  .odds-card {
    background: #161616;
    border-radius: 8px;
    padding: 10px 12px;
    margin: 6px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-left: 3px solid #333;
  }
  .horse-info { font-size: 15px; font-weight: bold; width: 30%; }
  .odds-group { display: flex; gap: 12px; align-items: center; text-align: right; }
  .odds-box { display: flex; flex-direction: column; align-items: flex-end; min-width: 60px; }
  .type-label { font-size: 10px; color: #777; }
  .odds-val { font-size: 16px; font-weight: bold; }

  .drop { color: #00ff88; }
  .rise { color: #ff4444; }
  .badge { font-size: 10px; padding: 1px 4px; border-radius: 3px; background: #222; }
</style>
</head>
<body>

<div class="header">
  <div class="title">
    🌙 MoonBus LIVE <span class="live-dot"></span>
  </div>
  <button class="reset-btn" onclick="resetBaseline()">重置基準</button>
</div>

<div class="race-selector" id="raceBtns"></div>
<span id="status">連接中...</span>

<!-- 連贏 / 位置連贏 大單異動卡片區 -->
<div class="alert-section" id="alertSection" style="display:none;">
  <div class="alert-title">
    <span>🔥 QIN / QPL 急劇落飛大單組合</span>
    <span style="font-size:10px;color:#888;">TOP 6 異動</span>
  </div>
  <div class="combo-grid" id="comboGrid"></div>
</div>

<div class="section-title">獨贏 (WIN) & 位置 (PLA)</div>
<div id="list">載入中...</div>

<script>
const WORKER_URL = "https://hkjc-live.vercel.app/api/odds";
let firstOdds = { win: {}, pla: {}, qin: {}, qpl: {} }; // 儲存初盤基準
let currentRace = 1;
let currentDate = new Date().toISOString().split('T')[0];

function initRaceButtons() {
  const container = document.getElementById("raceBtns");
  let html = "";
  for (let i = 1; i <= 11; i++) {
    html += `<button class="race-btn ${i === currentRace ? 'active' : ''}" onclick="changeRace(${i})">R${i}</button>`;
  }
  container.innerHTML = html;
}

function changeRace(raceNum) {
  if (currentRace === raceNum) return;
  currentRace = raceNum;
  firstOdds = { win: {}, pla: {}, qin: {}, qpl: {} }; // 重置基準
  
  document.querySelectorAll(".race-btn").forEach((btn, idx) => {
    btn.classList.toggle("active", (idx + 1) === raceNum);
  });

  document.getElementById("alertSection").style.display = "none";
  document.getElementById("list").innerHTML = `<div style="padding:20px;color:#888;text-align:center">載入第 ${raceNum} 場數據中...</div>`;
  loadReal();
}

function resetBaseline() {
  firstOdds = { win: {}, pla: {}, qin: {}, qpl: {} };
  loadReal();
  alert(`已將第 ${currentRace} 場現時賠率重置為最新監測基準！`);
}

async function loadReal() {
  try {
    const r = await fetch(`${WORKER_URL}?race=${currentRace}&date=${currentDate}&t=${Date.now()}`);
    let txt = (await r.text()).trim();

    let m = txt.match(/\{[\s\S]*\}/);
    if (!m) throw new Error("回應格式非 JSON");
    let json = JSON.parse(m[0]);

    let runnersMap = {};
    let comboDrops = []; // 紀錄 QIN / QPL 異動組合

    let pools = json.data?.raceMeeting?.race?.pools || json.data?.activeMeetings?.[0]?.races?.[0]?.pools || [];
    let winPool = pools.find(p => p.oddsType === "WIN");
    let plaPool = pools.find(p => p.oddsType === "PLA");
    let qinPool = pools.find(p => p.oddsType === "QIN") || json.OUT?.QIN;
    let qplPool = pools.find(p => p.oddsType === "QPL");

    // 1. 解析 WIN
    if (winPool) {
      winPool.oddsNodes.forEach(o => {
        let no = parseInt(o.horseNo, 10);
        runnersMap[no] = { no: no, win: parseFloat(o.odds), pla: 0 };
      });
    } else if (json.OUT?.WIN) {
      json.OUT.WIN.forEach(o => {
        let no = parseInt(o.no, 10);
        runnersMap[no] = { no: no, win: parseFloat(o.win), pla: 0 };
      });
    }

    // 2. 解析 PLA
    if (plaPool) {
      plaPool.oddsNodes.forEach(o => {
        let no = parseInt(o.horseNo, 10);
        if (!runnersMap[no]) runnersMap[no] = { no: no, win: 0, pla: 0 };
        runnersMap[no].pla = parseFloat(o.odds);
      });
    }

    // 3. 解析 QIN (連贏) 落飛
    let qinNodes = qinPool?.oddsNodes || (Array.isArray(qinPool) ? qinPool : []);
    qinNodes.forEach(o => {
      let combi = o.combi; // 例: "1-2"
      let odds = parseFloat(o.odds || o.win);
      if (!combi || !odds) return;

      if (!firstOdds.qin[combi]) firstOdds.qin[combi] = odds;
      let change = ((odds - firstOdds.qin[combi]) / firstOdds.qin[combi] * 100);

      if (change <= -5) { // 跌幅達 5% 或以上納入監測
        comboDrops.push({ type: 'QIN 連贏', combi: combi, odds: odds, change: change });
      }
    });

    // 4. 解析 QPL (位置連贏) 落飛
    if (qplPool?.oddsNodes) {
      qplPool.oddsNodes.forEach(o => {
        let combi = o.combi;
        let odds = parseFloat(o.odds);
        if (!combi || !odds) return;

        if (!firstOdds.qpl[combi]) firstOdds.qpl[combi] = odds;
        let change = ((odds - firstOdds.qpl[combi]) / firstOdds.qpl[combi] * 100);

        if (change <= -5) {
          comboDrops.push({ type: 'QPL 位置Q', combi: combi, odds: odds, change: change });
        }
      });
    }

    // 渲染 QIN/QPL 大單急跌卡片 (顯示 Top 6 跌得最猛烈的組合)
    if (comboDrops.length > 0) {
      comboDrops.sort((a, b) => a.change - b.change); // 跌最多排最前
      let top6 = comboDrops.slice(0, 6);
      let comboHtml = "";
      top6.forEach(c => {
        comboHtml += `
          <div class="combo-card">
            <div style="font-size:9px;color:#888">${c.type}</div>
            <div class="combo-name">${c.combi}</div>
            <div class="combo-odds">${c.odds.toFixed(1)}</div>
            <div class="combo-drop">落 ${c.change.toFixed(0)}%</div>
          </div>`;
      });
      document.getElementById("comboGrid").innerHTML = comboHtml;
      document.getElementById("alertSection").style.display = "block";
    } else {
      document.getElementById("alertSection").style.display = "none";
    }

    // 渲染馬匹 WIN & PLA 列表
    let runnerList = Object.values(runnersMap).sort((a, b) => a.no - b.no);

    if (runnerList.length === 0) {
      document.getElementById("list").innerHTML = `
        <div style="padding:30px 20px;color:#888;text-align:center">
          第 ${currentRace} 場未開市或無數據<br>
          <small style="font-size:10px;color:#555">${txt.slice(0, 80)}</small>
        </div>`;
      document.getElementById("status").innerText = `狀態: 已連線 (無數據)`;
      return;
    }

    let html = "";
    runnerList.forEach(run => {
      let no = run.no;
      let win = run.win;
      let pla = run.pla;

      if (!firstOdds.win[no] && win) firstOdds.win[no] = win;
      if (!firstOdds.pla[no] && pla) firstOdds.pla[no] = pla;

      let winChange = (firstOdds.win[no] && win) ? ((win - firstOdds.win[no]) / firstOdds.win[no] * 100) : 0;
      let winCls = winChange < -10 ? "drop" : (winChange > 10 ? "rise" : "");
      let winLabel = winChange < -10 ? `落${winChange.toFixed(0)}%` : (winChange > 10 ? `↑${winChange.toFixed(0)}%` : `-`);

      let plaChange = (firstOdds.pla[no] && pla) ? ((pla - firstOdds.pla[no]) / firstOdds.pla[no] * 100) : 0;
      let plaCls = plaChange < -10 ? "drop" : (plaChange > 10 ? "rise" : "");
      let plaLabel = plaChange < -10 ? `落${plaChange.toFixed(0)}%` : (plaChange > 10 ? `↑${plaChange.toFixed(0)}%` : `-`);

      html += `
        <div class="odds-card">
          <div class="horse-info">${no}號</div>
          <div class="odds-group">
            <div class="odds-box">
              <span class="type-label">獨贏</span>
              <span class="odds-val ${winCls}">${win ? win.toFixed(1) : '-'}</span>
              <span class="badge ${winCls}">${winLabel}</span>
            </div>
            <div class="odds-box">
              <span class="type-label">位置</span>
              <span class="odds-val ${plaCls}">${pla ? pla.toFixed(1) : '-'}</span>
              <span class="badge ${plaCls}">${plaLabel}</span>
            </div>
          </div>
        </div>`;
    });

    document.getElementById("list").innerHTML = html;
    document.getElementById("status").innerText = `R${currentRace} 真數據 ${new Date().toLocaleTimeString()} | ${runnerList.length} 駒`;

  } catch (e) {
    document.getElementById("status").innerText = "連線異常: " + e.message;
    console.error(e);
  }
}

initRaceButtons();
loadReal();
setInterval(loadReal, 15000);
</script>

</body>
</html>
