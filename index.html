<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Moonbus choice V9.1</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#0e0e10;color:#eaeaea;padding:10px}.header{background:linear-gradient(135deg,#1a1a2e,#16213e);padding:16px;border-radius:16px;margin-bottom:12px;border:1px solid #333}.race-tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0}.race-tab{padding:10px 16px;background:#1e1e24;border-radius:24px;font-size:12px;white-space:nowrap;border:1px solid #333;cursor:pointer;flex-shrink:0}.race-tab.active{background:#ff4757;color:#fff;font-weight:700}.horse-card{background:#18181c;border-radius:14px;padding:12px;margin-bottom:12px;border:1px solid #2a2a2e}.odds-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1.2fr;gap:6px;margin-top:6px}.t-box{background:#1f1f25;border-radius:10px;padding:8px;text-align:center}.t-box.final{background:#ff4757;color:#fff}.rec{border-radius:12px;padding:10px;margin-bottom:8px;font-size:12px}.green{background:#162a1a;border-left:4px solid #2ed573}.red{background:#2a161a;border-left:4px solid #ff4757}.yellow{background:#2a2416;border-left:4px solid #ffa502}</style></head><body>
<div class="header"><h1>🚌 Moonbus choice V9.1</h1><p style="font-size:11px;color:#2ed573" id="status">✅ Moonbus choice V9.1 | 真實賠率自動版 | 載入中...</p><p id="cnt" style="font-size:11px;color:#aaa;margin-top:4px"></p></div>
<div class="race-tabs" id="tabs"></div>
<div id="info" style="background:#18181c;padding:10px;border-radius:10px;margin:10px 0;font-size:12px"></div>
<div id="recs"></div><div id="horses"></div>
<script>
var FALLBACK=[{no:1,venue:"沙田",dist:1200,cls:"4班",track:"好地",horses:[{n:1,name:"金鑽貴人",d:3,j:"潘頓",t:"文家良",f:90,tt:92,g:"A+",t1:2.8,t2:2.5,t3:2.2,drop:21.4,smart:0},{n:2,name:"浪漫勇士",d:1,j:"麥道朗",t:"沈集成",f:88,tt:88,g:"A+",t1:15,t2:9.5,t3:6.5,drop:56.6,smart:1},{n:8,name:"爆冷王",d:10,j:"何澤堯",t:"希斯",f:70,tt:78,g:"A",t1:28,t2:22,t3:14,drop:50,smart:1}]},{no:2,venue:"沙田",dist:1400,cls:"3班",track:"好地",horses:[{n:1,name:"永遠美麗",d:2,j:"潘頓",t:"蔡約翰",f:86,tt:87,g:"A+",t1:3.5,t2:3.2,t3:3.0,drop:14.2,smart:0},{n:2,name:"金鎗六十",d:1,j:"何澤堯",t:"呂健威",f:95,tt:98,g:"A+",t1:1.8,t2:1.6,t3:1.5,drop:16,smart:0},{n:3,name:"浪漫風采",d:3,j:"麥道朗",t:"沈集成",f:87,tt:89,g:"A+",t1:18,t2:12,t3:7.5,drop:58.3,smart:1}]}];
for(var i=3;i<=10;i++){FALLBACK.push({no:i,venue:i<=6?"沙田":"跑馬地",dist:i%2==0?1200:1650,cls:"3班",track:"好地",horses:[{n:1,name:"星運皇爵"+i,d:1,j:"潘頓",t:"蔡約翰",f:86,tt:88,g:"A+",t1:3.2,t2:2.9,t3:2.6,drop:18,smart:0},{n:2,name:"幸運同行"+i,d:2,j:"麥道朗",t:"沈集成",f:84,tt:86,g:"A",t1:16,t2:10,t3:6.8,drop:57.5,smart:1},{n:7,name:"冷門至尊"+i,d:10,j:"何澤堯",t:"希斯",f:68,tt:75,g:"A",t1:35,t2:26,t3:18,drop:48.5,smart:1}]});}
var RACES=FALLBACK; var cur=0;
function normalize(r){return r.map(function(rc){return{no:rc.race_no||rc.no,venue:rc.venue||"沙田",dist:rc.distance||rc.dist||1200,cls:rc.class||rc.cls||"3班",track:rc.track||"好地",horses:(rc.horses||[]).map(function(h){return{n:h.no||h.n,d:h.draw||h.d||1,name:h.name||"待定",j:h.jockey||h.j||"--",t:h.trainer||h.t||"--",f:h.fund||h.f||70,tt:h.total||h.tt||70,g:h.grade||h.g||"A",t1:h.t1||h.win_odds||10,t2:h.t2||h.t1||10,t3:h.t3||h.win_odds||10,drop:h.drop||0,smart:h.smart||0}})}});}
function renderTabs(){var h="";for(var i=0;i<RACES.length;i++){h+='<div class="race-tab '+(i==cur?'active':'')+'" onclick="selectRace('+i+')">第'+RACES[i].no+'場 '+RACES[i].dist+'m</div>';}document.getElementById('tabs').innerHTML=h;document.getElementById('cnt').innerText='今日共 '+RACES.length+'場 - 全部自動顯示 | 左右滑動轉場';}
function selectRace(i){cur=i;renderTabs();var rc=RACES[i];document.getElementById('info').innerHTML='<b>第'+rc.no+'場 '+rc.venue+' '+rc.dist+'m '+rc.cls+' '+rc.track+'</b> | '+rc.horses.length+'匹';var solid=rc.horses.slice().sort(function(a,b){return b.f-a.f}).slice(0,4);var heavy=rc.horses.slice().sort(function(a,b){return b.drop-a.drop}).slice(0,4);var outs=[];for(var k=0;k<rc.horses.length;k++){if(rc.horses[k].t3>=12 && rc.horses[k].drop>=30)outs.push(rc.horses[k]);}document.getElementById('recs').innerHTML='<div class="rec green">🟢 最合理 '+solid.map(function(h){return h.n+'號'+h.name}).join(' | ')+'</div><div class="rec red">🔴 重票 '+heavy.map(function(h){return h.n+'號 -'+h.drop+'%'}).join(' | ')+'</div><div class="rec yellow">⚡️ 爆冷 '+(outs.length?outs.map(function(h){return h.n+'號'+h.name+' '+h.t3+'倍'}).join(' | '):'暫無')+'</div>';var hh="";var sorted=rc.horses.slice().sort(function(a,b){return b.tt-a.tt});for(var j=0;j<sorted.length;j++){var h=sorted[j];hh+='<div class="horse-card"><b>'+h.n+'號 '+h.name+' '+h.d+'檔</b> <span style="float:right;background:#2ed573;color:#000;padding:2px 6px;border-radius:10px;font-size:10px">'+h.g+' '+h.tt+'分</span><div style="font-size:11px;color:#888;margin:4px 0">🐴 '+h.j+'/'+h.t+' | '+h.f+'分 '+(h.smart?'🔥Smart':'')+'</div><div class="odds-grid"><div class="t-box"><b>'+h.t1+'倍</b><br><span style="font-size:8px">T1隔夜</span></div><div class="t-box"><b>'+h.t2+'倍</b><br><span style="font-size:8px">T2中段</span></div><div class="t-box"><b>'+h.t3+'倍</b><br><span style="font-size:8px">T3臨場</span></div><div class="t-box final"><b>-'+h.drop+'%</b><br><span style="font-size:8px">T3vsT1</span></div></div></div>';}document.getElementById('horses').innerHTML=hh;}
async function loadReal(){try{var res=await fetch('data.json?v='+Date.now());if(!res.ok)throw 'no json';var data=await res.json();if(data.races && data.races.length>0){RACES=normalize(data.races);document.getElementById('status').innerText='✅ Moonbus choice V9.1 | 真實賠率 - '+data.updated+' | 共'+RACES.length+'場';}else{throw 'empty'}}catch(e){document.getElementById('status').innerText='✅ Moonbus choice V9.1 | 示範模式 (賽日自動轉真實) | 共'+RACES.length+'場';}renderTabs();selectRace(0);}
loadReal();
</script></body></html>
