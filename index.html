<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoonBus V9.8.5 真落飛完整版</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0a0a0a;color:#fff;margin:0;padding:10px}
.header{display:flex;justify-content:space-between;align-items:center}
.live-dot{width:8px;height:8px;background:#00ff88;border-radius:50%;display:inline-block;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
.odds-card{background:#1a1a1a;border-radius:12px;padding:12px;margin:8px 0;display:flex;justify-content:space-between}
.drop{color:#00ff88;font-weight:bold}
.rise{color:#ff4444}
</style>
</head>
<body>
<div class="header"><h3>🌙 MoonBus V9.8.5 <span class="live-dot"></span> LIVE</h3><span id="status">連接緊馬會...</span></div>
<div id="list">載入中...</div>

<script>
const WORKER_URL = "https://moonbus-odds.wingyuen28.workers.dev";
let firstOdds = {};
let race = 1;
let date = "2026-10-01";

async function loadReal(){
  try{
    const r = await fetch(`${WORKER_URL}?race=${race}&date=${date}&t=${Date.now()}`);
    let txt = (await r.text()).trim();
    // 容錯抽JSON：唔理前面有咩字，淨抽最外層 {...}
    let m = txt.match(/\{[\s\S]*\}/);
    if(!m) throw new Error("無數據: "+txt.slice(0,100));
    let json = JSON.parse(m[0]);

    let runners = [];
    // 新Worker 2564 bytes GraphQL格式
    if(json.data?.activeMeetings){
        let meeting = json.data.activeMeetings[0];
        let raceData = meeting.races?.find(x=>x.no==race) || meeting.races?.[0];
        let winPool = raceData?.pools?.find(p=>p.oddsType==="WIN");
        if(winPool) runners = winPool.oddsNodes.map(o=>({No:o.horseNo, WIN:o.odds, Name:""}));
    }else if(json.OUT?.WIN){ // 你原本V9.8.3諗住用嘅格式
        runners = json.OUT.WIN.map(o=>({No:o.no, WIN:o.win, Name:o.name||""}));
    }else if(json.Runners){ // V9.8.1原有格式
        runners = json.Runners;
    }

    if(runners.length===0){
        document.getElementById("list").innerHTML = `<div style="padding:20px;color:#888">已連接馬會，等待開市...<br><small>${txt.slice(0,200)}</small></div>`;
        return;
    }

    let html = "";
    runners.forEach(run=>{
      let no = run.No || run.no;
      let win = parseFloat(run.WIN || run.win || run.odds);
      if(!win) return;
      if(!firstOdds[no]) firstOdds[no] = win;
      let change = ((win - firstOdds[no]) / firstOdds[no] * 100);
      let cls = change < -10? "drop" : (change > 10? "rise" : "");
      let label = change < -10? `落飛 ${change.toFixed(1)}%` : (change > 10? `↑ ${change.toFixed(1)}%` : `${change.toFixed(1)}%`);
      html += `<div class="odds-card"><div>${no}號 ${run.Name||''}</div><div><b>${win}</b> <span class="${cls}">${label}</span></div></div>`;
    });
    document.getElementById("list").innerHTML = html;
    document.getElementById("status").innerText = `真數據 ${new Date().toLocaleTimeString()} | ${Object.keys(firstOdds).length}駒`;
  }catch(e){
    document.getElementById("status").innerText = "Error: "+e.message;
    console.error(e);
  }
}
loadReal();
setInterval(loadReal, 15000);
</script>
</body>
</html>
