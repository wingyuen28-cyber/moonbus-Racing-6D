<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>moonbus racing v6 - 手機版</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,PingFang HK,sans-serif}body{background:#0e0e10;color:#eaeaea;padding:12px}.header{background:linear-gradient(135deg,#1a1a2e,#16213e);padding:16px;border-radius:14px;margin-bottom:12px;border:1px solid #333}.header h1{font-size:18px;font-weight:900}.header p{font-size:11px;color:#888;margin-top:4px}.rec-wrap{display:grid;gap:10px;margin-bottom:14px}.rec{border-radius:12px;padding:12px;border-left:4px solid #333}.rec.green{border-left-color:#2ed573;background:#162a1a}.rec.red{border-left-color:#ff4757;background:#2a161a}.rec.yellow{border-left-color:#ffa502;background:#2a2416}.rec h3{font-size:13px;margin-bottom:6px}.rec ul{font-size:12px;list-style:none;line-height:1.6}.horse-card{background:#18181c;border-radius:14px;padding:12px;margin-bottom:12px;border:1px solid #2a2a2e}.horse-head{display:flex;justify-content:space-between;align-items:center}.badge{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700}.grade-S{background:#ffd700;color:#000}.grade-Aplus{background:#2ed573;color:#000}.grade-A{background:#70a1ff;color:#000}.dims{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}.dim{background:#222228;border-radius:8px;padding:8px;font-size:11px}.dim b{font-size:11px;color:#fff}.odds-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1.2fr;gap:6px;margin:8px 0}.t-box{background:#1f1f25;border-radius:10px;padding:8px;text-align:center;border:1px solid #2c2c34}.t-box.hot{border-color:#ff4757;background:#261a1e}.t-box.final{background:linear-gradient(135deg,#ff4757,#ff6b81);color:#fff;border:none}.t-label{font-size:9px;color:#aaa}.t-val{font-size:16px;font-weight:900;display:block}.t-diff{font-size:10px}.t-diff.down{color:#2ed573}.pool{font-size:9px;padding:3px 6px;background:#222;border-radius:10px;margin:2px;display:inline-block}.pool.drop{background:#2a1a1a;border:1px solid #ff4757;color:#ff8f8f}.input-box{background:#222228;border-radius:12px;padding:12px;margin-top:14px;border:1px dashed #444}.input-box input{width:70px;padding:6px;border-radius:6px;border:1px solid #333;background:#111;color:#fff;margin:2px}</style></head><body>
<div class="header"><h1>🏁 6維終極版 v6.0 - 手機版</h1><p id="race-info">沙田 1200m C+3 好地 | T1隔夜20% T2中段30% T3臨場50% + T3vsT1終極 | 6維已整合</p></div>
<div class="rec-wrap"><div class="rec green"><h3>🟢 最合理結果 4隻 - 基本面最頂級</h3><ul id="solid-list"><li>載入中...</li></ul></div><div class="rec red"><h3>🔴 重票之選 4隻 - 跨彩池掃貨</h3><ul id="heavy-list"><li>載入中...</li></ul></div><div class="rec yellow"><h3>⚡️ 爆冷之選 2隻 - T3突襲聰明錢</h3><ul id="outsider-list"><li>載入中...</li></ul></div></div>
<div id="horses"></div>
<div class="input-box"><b>📱 免費測試：手動輸入馬會賠率</b><br><small>去 bet.hkjc.com 睇獨贏賠率，輸入T1隔夜/T2中段/T3臨場，自動計T3vsT1</small><br><br>馬號 <input id="in-no" value="5" style="width:40px"> T1 <input id="in-t1" value="15"> T2 <input id="in-t2" value="9.5"> T3 <input id="in-t3" value="6.5"> <button onclick="manualCalc()" style="padding:6px 12px;background:#ff4757;color:#fff;border:none;border-radius:6px">計算</button><div id="manual-result" style="margin-top:8px;font-size:12px;color:#2ed573"></div></div>
<script>
const demoData={"race":"沙田 1200m C+3 好地","timestamp":new Date().toISOString(),"horses":[{"no":5,"name":"浪漫勇士","draw":1,"style":"領放","jockey":"潘頓","trainer":"沈集成","d1":88,"d2":85,"d3":92,"d4":87,"d5":89,"fundamental":88,"total":88,"grade":"A+","d1_desc":"獨贏12.7% 上名29% | 近6戰78分","d2_desc":"1檔 上名35% ✅內檔領放+12%","d3_desc":"⭐️深度默契 42%上名","d4_desc":"🔥從化特訓快攻 | 體重1135","d5_desc":"T1 15→T2 9.5→T3 6.5 | T3vsT1 -56.6%","d5_tags":["💎高Value","🛡️大戶保險盤"],"d5_display":{"t1":{"value":15,"diff":0},"t2":{"value":9.5,"diff":36.6},"t3":{"value":6.5,"diff":31.5},"t3_vs_t1":{"value":6.5,"diff":56.6,"is_smart":true},"all_drops":{"win":{"t1":15,"t2":9.5,"t3":6.5,"t1_t2":36.6,"t2_t3":31.5,"t1_t3":56.6},"place":{"t1":4.2,"t2":3.1,"t3":2.2,"t1_t2":26,"t2_t3":29,"t1_t3":47}},"cross_pool_count":3},"odds":{"win":[15,9.5,6.5]}},{"no":8,"name":"爆冷王","draw":5,"style":"後上","jockey":"田泰安","trainer":"桂福特","d1":65,"d2":75,"d3":78,"d4":72,"d5":85,"fundamental":72,"total":77,"grade":"A","d1_desc":"獨贏10% 上名25%","d2_desc":"5檔 上名28%","d3_desc":"默契一般 45%上名","d4_desc":"留港操練 | 體重1125","d5_desc":"T1 28→T2 22→T3 14 | T3vsT1 -50%","d5_tags":["💎高Value冷門 72分但14倍","🛡️大戶保險盤 W14 vs P2.8"],"d5_display":{"t1":{"value":28,"diff":0},"t2":{"value":22,"diff":21.4},"t3":{"value":14,"diff":36.3},"t3_vs_t1":{"value":14,"diff":50,"is_smart":true},"all_drops":{"win":{"t1":28,"t2":22,"t3":14,"t1_t2":21.4,"t2_t3":36.3,"t1_t3":50}},"cross_pool_count":2},"odds":{"win":[28,22,14]}}],"recommendations":{"solid":{"detail":["5號 浪漫勇士 基本面88分"]},"heavy":{"detail":["5號 浪漫勇士 T3vsT1 -56.6% 3個彩池"]},"outsiders":{"detail":["8號 爆冷王 14倍 T3急瀉36.3%"]}}};
function render(data){document.getElementById('solid-list').innerHTML=data.recommendations.solid.detail.map(d=>`<li>${d}</li>`).join('');document.getElementById('heavy-list').innerHTML=data.recommendations.heavy.detail.map(d=>`<li>${d}</li>`).join('');document.getElementById('outsider-list').innerHTML=data.recommendations.outsiders.detail.map(d=>`<li>${d}</li>`).join('');document.getElementById('horses').innerHTML=data.horses.map(h=>`<div class="horse-card"><div class="horse-head"><b>${h.no}號 ${h.name} ${h.draw}檔 ${h.style} ${h.jockey}/${h.trainer}</b><span class="badge grade-${h.grade}">${h.grade} ${h.total}分</span></div><div style="font-size:11px;color:#888;margin:6px 0">D1 ${h.d1} ${h.d1_desc} | D2 ${h.d2} ${h.d2_desc} | D3 ${h.d3} ${h.d3_desc} | D4 ${h.d4} ${h.d4_desc}</div><div class="odds-grid"><div class="t-box"><span class="t-label">T1 隔夜 20%</span><span class="t-val">${h.d5_display.t1.value}倍</span><span class="t-diff">基準</span></div><div class="t-box"><span class="t-label">T2 中段 30%</span><span class="t-val">${h.d5_display.t2.value}倍</span><span class="t-diff down">↓ ${h.d5_display.t2.diff.toFixed(1)}%</span></div><div class="t-box hot"><span class="t-label">T3 臨場 50%</span><span class="t-val">${h.d5_display.t3.value}倍</span><span class="t-diff down">↓ ${h.d5_display.t3.diff.toFixed(1)}%</span></div><div class="t-box final"><span class="t-label">T3 vs T1 終極</span><span class="t-val">-${h.d5_display.t3_vs_t1.diff.toFixed(1)}%</span><span class="t-diff">${h.d5_display.t3_vs_t1.is_smart?'🔥Smart Money':'正常'}</span></div></div><div>${Object.entries(h.d5_display.all_drops).map(([k,v])=>`<span class="pool ${v.t1_t3>20?'drop':''}">${k.toUpperCase()} ${v.t1}→${v.t3} -${v.t1_t3.toFixed(0)}%</span>`).join('')}</div><div style="font-size:11px;margin-top:6px;color:#aaa">${h.d5_desc} ${h.d5_tags.join(' ')}</div></div>`).join('');}
function manualCalc(){const t1=parseFloat(document.getElementById('in-t1').value),t2=parseFloat(document.getElementById('in-t2').value),t3=parseFloat(document.getElementById('in-t3').value);const d12=(t1-t2)/t1*100,d23=(t2-t3)/t2*100,d13=(t1-t3)/t1*100;let tag=d13>=40?'🔥Smart Money急瀉':'正常';if(d13>=50)tag+=' 💎超級落飛';document.getElementById('manual-result').innerHTML=`${document.getElementById('in-no').value}號: T1 ${t1}→T2 ${t2} ↓${d12.toFixed(1)}% →T3 ${t3} ↓${d23.toFixed(1)}% | <b>T3 vs T1 -${d13.toFixed(1)}% ${tag}</b>`;}
render(demoData);
</script></body></html>
